<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingestion Report</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card-bg: #ffffff;
    --border: #dfe3e8;
    --text: #1b1f23;
    --muted: #6a737d;
    --accent: #2f6feb;
    --green: #1a7f37;
    --amber: #9a6700;
    --red: #cf222e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 0.9rem; }

  #picker-row { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  #open-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  #open-btn:hover { opacity: 0.9; }
  #file-input { display: none; }
  #status { color: var(--muted); font-size: 0.9rem; }

  #empty-state {
    color: var(--muted);
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 32px;
    text-align: center;
  }

  .run {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 18px;
    overflow: hidden;
  }
  .run-header {
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    gap: 16px;
    flex-wrap: wrap;
  }
  .run-header:hover { background: #fafbfc; }
  .run-title { font-weight: 600; }
  .run-time { color: var(--muted); font-size: 0.85rem; }

  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat {
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 0.8rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .stat.read { background: #eef1f4; color: var(--text); }
  .stat.loaded { background: #ddf4e4; color: var(--green); }
  .stat.updated { background: #fff1c2; color: var(--amber); }
  .stat.skipped { background: #eef1f4; color: var(--muted); }
  .stat.rejected { background: #ffe0e0; color: var(--red); }

  .run-body { border-top: 1px solid var(--border); padding: 0 18px 18px; display: none; }
  .run.open .run-body { display: block; }
  .run.open .chevron { transform: rotate(90deg); }
  .chevron { transition: transform 0.15s ease; color: var(--muted); }

  .section-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); margin: 18px 0 8px; }

  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: none; }

  .badge { border-radius: 4px; padding: 1px 6px; font-size: 0.75rem; font-weight: 600; }
  .badge.rejected { background: #ffe0e0; color: var(--red); }
  .badge.skipped { background: #eef1f4; color: var(--muted); }

  .diff-old { color: var(--red); text-decoration: line-through; }
  .diff-new { color: var(--green); }
  .nothing { color: var(--muted); font-style: italic; font-size: 0.85rem; }
</style>
</head>
<body>

<h1>Ingestion Report</h1>
<p class="sub">Reads <code>ingestion-log.json</code> directly in your browser &mdash; nothing is uploaded anywhere.</p>

<div id="picker-row">
  <button id="open-btn">Open ingestion-log.json</button>
  <input type="file" id="file-input" accept="application/json,.json">
  <span id="status"></span>
</div>

<div id="empty-state">No log loaded yet. Click "Open ingestion-log.json" and select the file from your project folder.</div>
<div id="runs"></div>

<script>
(function () {
  "use strict";

  var openBtn = document.getElementById("open-btn");
  var fileInput = document.getElementById("file-input");
  var statusEl = document.getElementById("status");
  var emptyState = document.getElementById("empty-state");
  var runsEl = document.getElementById("runs");

  openBtn.addEventListener("click", function () { fileInput.click(); });

  fileInput.addEventListener("change", function () {
    var file = fileInput.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var data = JSON.parse(e.target.result);
        render(data, file.name);
        statusEl.textContent = "Loaded " + file.name;
      } catch (err) {
        statusEl.textContent = "Could not parse that file as JSON: " + err.message;
      }
    };
    reader.onerror = function () {
      statusEl.textContent = "Could not read that file.";
    };
    reader.readAsText(file);
  });

  function esc(s) {
    if (s === null || s === undefined) return "";
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function formatTime(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleString(undefined, {
      year: "numeric", month: "short", day: "numeric",
      hour: "2-digit", minute: "2-digit", second: "2-digit",
      timeZoneName: "short"
    });
  }

  function render(data, fileName) {
    if (!Array.isArray(data)) {
      statusEl.textContent = fileName + " doesn't look like an ingestion log (expected a JSON array of runs).";
      return;
    }
    emptyState.style.display = "none";
    runsEl.innerHTML = "";

    var runs = data.slice().reverse(); // newest first

    runs.forEach(function (run, idx) {
      var card = document.createElement("div");
      card.className = "run" + (idx === 0 ? " open" : "");

      var header = document.createElement("div");
      header.className = "run-header";
      header.innerHTML =
        '<div>' +
          '<span class="chevron">&#9656;</span> ' +
          '<span class="run-title">' + esc(run.source_file || "unknown file") + '</span> ' +
          '<span class="run-time">' + esc(formatTime(run.run_at)) + '</span>' +
        '</div>' +
        '<div class="stats">' +
          stat("read", run.rows_read, "read") +
          stat("loaded", run.loaded, "loaded") +
          stat("updated", run.updated, "updated") +
          stat("skipped", run.skipped, "skipped") +
          stat("rejected", run.rejected, "rejected") +
        '</div>';
      header.addEventListener("click", function () { card.classList.toggle("open"); });

      var body = document.createElement("div");
      body.className = "run-body";
      body.appendChild(buildNotLoadedSection(run.not_loaded || []));
      body.appendChild(buildUpdatesSection(run.updates || []));

      card.appendChild(header);
      card.appendChild(body);
      runsEl.appendChild(card);
    });
  }

  function stat(cls, value, label) {
    return '<span class="stat ' + cls + '">' + (value === undefined ? 0 : value) + ' ' + label + '</span>';
  }

  function buildNotLoadedSection(rows) {
    var wrap = document.createElement("div");
    var title = document.createElement("div");
    title.className = "section-title";
    title.textContent = "Rows not loaded (" + rows.length + ")";
    wrap.appendChild(title);

    if (!rows.length) {
      var none = document.createElement("div");
      none.className = "nothing";
      none.textContent = "None — every row was loaded or updated.";
      wrap.appendChild(none);
      return wrap;
    }

    var table = document.createElement("table");
    table.innerHTML =
      "<thead><tr><th>Line</th><th>Title</th><th>Status</th><th>Reason</th><th>Detail</th></tr></thead>";
    var tbody = document.createElement("tbody");
    rows.forEach(function (r) {
      var tr = document.createElement("tr");
      tr.innerHTML =
        "<td>" + esc(r.line) + "</td>" +
        "<td>" + esc(r.title || "—") + "</td>" +
        "<td><span class=\"badge " + esc(r.status) + "\">" + esc(r.status) + "</span></td>" +
        "<td>" + esc(r.reason) + "</td>" +
        "<td>" + esc(r.detail) + "</td>";
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    return wrap;
  }

  function buildUpdatesSection(updates) {
    var wrap = document.createElement("div");
    var title = document.createElement("div");
    title.className = "section-title";
    title.textContent = "Updated rows (" + updates.length + ")";
    wrap.appendChild(title);

    if (!updates.length) {
      var none = document.createElement("div");
      none.className = "nothing";
      none.textContent = "None.";
      wrap.appendChild(none);
      return wrap;
    }

    var table = document.createElement("table");
    table.innerHTML =
      "<thead><tr><th>Line</th><th>Title</th><th>Changed fields</th></tr></thead>";
    var tbody = document.createElement("tbody");
    updates.forEach(function (u) {
      var changedHtml = Object.keys(u.changed || {}).map(function (field) {
        var c = u.changed[field];
        return "<div><strong>" + esc(field) + "</strong>: " +
          "<span class=\"diff-old\">" + esc(c.old) + "</span> &rarr; " +
          "<span class=\"diff-new\">" + esc(c.new) + "</span></div>";
      }).join("");
      var tr = document.createElement("tr");
      tr.innerHTML =
        "<td>" + esc(u.line) + "</td>" +
        "<td>" + esc(u.title || "—") + "</td>" +
        "<td>" + changedHtml + "</td>";
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    return wrap;
  }
})();
</script>
</body>
</html>
